[project]
name = "pythonic-function-calling-data"
version = "0.1.0"
description = "Repository for the Pythonic Function Calling data generation with Dria Network"
authors = [
  { name = "andthattoo" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "openai>=1.44.0",
  "jsonschema>=4.23.0",
  "matplotlib>=3.7.0",
  "numpy>=1.26,<2",
  "transformers>=4.37.0",
  "python-dateutil>=2.8.2",
  "tqdm>=4.64.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pathlib2>=2.3.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "BFCL_extraction*"]

[tool.setuptools]
py-modules = ["openai_utils", "run_s1_openai", "run_s2_openai", "run_s3_openai", "run_s4_openai"]
